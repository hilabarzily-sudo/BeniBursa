[project]
name = "benibursa-worker"
version = "0.1.0"
description = "BeniBursa ML analysis & generation worker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.17",
    "ffmpeg-python>=0.2.0",
    "scenedetect[opencv]>=0.6.5",
    "openai-whisper>=20240930",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "anthropic>=0.39.0",
    "supabase>=2.10.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.7.0", "pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
